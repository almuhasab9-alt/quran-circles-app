name: quran_center
description: متابعة حلقات مركز السنة للعلوم الشرعية وتأهيل الدعاة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  pdf: ^3.12.0
  archive: ^4.0.9
  universal_io: ^2.3.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  image_path: assets/images/center_logo.png
  adaptive_icon_background: "#0B5E48"
  adaptive_icon_foreground: assets/images/center_logo.png
  web:
    generate: true
    image_path: assets/images/center_logo.png
    background_color: "#0B5E48"

flutter_native_splash:
  color: "#0B5E48"
  image: assets/images/center_logo.png
  android_12:
    color: "#0B5E48"
    image: assets/images/center_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
