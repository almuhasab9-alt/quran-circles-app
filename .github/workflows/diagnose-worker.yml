name: Diagnose Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Find Worker URL via Cloudflare API
        id: url
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          echo "=== Listing workers ==="
          WORKERS=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $TOKEN" 2>&1)
          echo "$WORKERS" | python3 -m json.tool 2>/dev/null || echo "$WORKERS"

          # Get the workers.dev subdomain
          echo "=== Getting workers.dev subdomain ==="
          SUBDOMAIN=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $TOKEN" 2>&1)
          echo "$SUBDOMAIN"
          SUB=$(echo "$SUBDOMAIN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('result',{}).get('subdomain',''))" 2>/dev/null || echo "")
          echo "Subdomain: $SUB"

          if [ -n "$SUB" ]; then
            WORKER_URL="https://quran-circles-api.$SUB.workers.dev"
            echo "Worker URL: $WORKER_URL"
            echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Could not determine workers.dev subdomain"
            exit 1
          fi

      - name: Test API endpoints
        run: |
          URL="${{ steps.url.outputs.worker_url }}"
          echo "=== Testing: $URL ==="

          echo "=== Health ==="
          curl -sS "$URL/api/health" 2>&1

          echo ""
          echo "=== Users ==="
          curl -sS "$URL/api/users" 2>&1 | head -c 500

          echo ""
          echo "=== Halaqas ==="
          curl -sS "$URL/api/halaqas" 2>&1 | head -c 500

          echo ""
          echo "=== Seed ==="
          curl -sS -X POST "$URL/api/seed" -H "Content-Type: application/json" -d '{}' 2>&1

          echo ""
          echo "=== After seed: Users count ==="
          curl -sS "$URL/api/users" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Users: {len(d)}')" 2>/dev/null || echo "(parse error)"

          echo "=== After seed: Halaqas count ==="
          curl -sS "$URL/api/halaqas" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Halaqas: {len(d)}')" 2>/dev/null || echo "(parse error)"

          echo "=== After seed: Students count ==="
          curl -sS "$URL/api/students" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Students: {len(d)}')" 2>/dev/null || echo "(parse error)"

          echo "=== After seed: Daily records count ==="
          curl -sS "$URL/api/daily-records" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Daily records: {len(d)}')" 2>/dev/null || echo "(parse error)"

      - name: Write report
        run: |
          URL="${{ steps.url.outputs.worker_url }}"
          {
            echo "# Worker Diagnosis Report"
            echo "Date: $(date -u)"
            echo ""
            echo "- **Worker URL**: $URL"
            echo "- **Health**: $(curl -sS "$URL/api/health" 2>&1)"
            echo "- **Users**: $(curl -sS "$URL/api/users" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Halaqas**: $(curl -sS "$URL/api/halaqas" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Students**: $(curl -sS "$URL/api/students" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Daily records**: $(curl -sS "$URL/api/daily-records" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          } > worker-diagnosis.md 2>&1
          cat worker-diagnosis.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker-diagnosis.md
          git commit -m "chore: add worker diagnosis report" || echo "no changes"
          git push || echo "nothing to push"
