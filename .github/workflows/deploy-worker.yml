name: Deploy Worker API

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Verify token
        run: npx wrangler whoami

      - name: Deploy Worker
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy.txt
          WORKER_URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.txt | head -1)
          echo "WORKER_URL=$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
        id: deploy

      - name: Verify health
        run: |
          sleep 3
          URL="${{ steps.deploy.outputs.worker_url }}"
          echo "Checking $URL/api/health"
          curl -sS "$URL/api/health" || echo "Health check failed"

      - name: Write report
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          {
            echo "# Worker API Deploy Report"
            echo "Date: $(date -u)"
            echo ""
            echo "- **Worker URL**: $URL"
            echo "- **Health check**: $(curl -sS "$URL/api/health" 2>&1)"
            echo ""
            echo "## Endpoints"
            echo "- \`GET /api/health\` — health check"
            echo "- \`POST /api/seed\` — seed demo data"
            echo "- \`POST /api/wipe\` — wipe all data"
            echo "- \`GET/POST /api/users\`"
            echo "- \`GET/PUT/DELETE /api/halaqas/:id\`"
            echo "- \`GET/POST /api/students\`"
            echo "- \`GET/PUT/DELETE /api/students/:id\`"
            echo "- \`GET/POST /api/daily-records\`"
            echo "- \`GET/POST /api/weekly-plans\`"
            echo "- \`GET/POST /api/student-transfers\`"
            echo "- \`POST /api/transfer-student\` — atomic transfer"
          } > worker-deploy-report.md 2>&1
          cat worker-deploy-report.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker-deploy-report.md
          git commit -m "chore: add worker deploy report" || echo "no changes"
          git push || echo "nothing to push"
