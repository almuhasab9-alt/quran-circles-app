name: Deploy Worker API

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Verify token
        run: npx wrangler whoami

      - name: Register workers.dev subdomain
        run: |
          # Check if subdomain exists
          echo "=== Checking workers.dev subdomain ==="
          RES=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 2>&1)
          echo "$RES"
          SUB=$(echo "$RES" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result',{}).get('subdomain',''))" 2>/dev/null || echo "")

          if [ -z "$SUB" ]; then
            echo "=== Registering subdomain 'almuhasab9-alt' ==="
            REG_RES=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"subdomain":"almuhasab9-alt"}' 2>&1)
            echo "$REG_RES"
            SUB="almuhasab9-alt"
          fi
          echo "Subdomain: $SUB"
          echo "subdomain=$SUB" >> $GITHUB_ENV

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          npx wrangler deploy > /tmp/deploy_output.txt 2>&1 || true
          echo "=== Deploy output ==="
          cat /tmp/deploy_output.txt
          WORKER_URL="https://quran-circles-api.${{ env.subdomain }}.workers.dev"
          echo "Expected URL: $WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

      - name: Health check + seed
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          echo "Worker URL: $URL"
          sleep 3
          echo "=== Health ==="
          curl -sS "$URL/api/health" 2>&1 || true
          echo ""
          echo "=== Seed ==="
          curl -sS -X POST "$URL/api/seed" -H "Content-Type: application/json" -d '{}' 2>&1 || true
          echo ""
          echo "=== After seed ==="
          echo "Users: $(curl -sS "$URL/api/users" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Halaqas: $(curl -sS "$URL/api/halaqas" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Students: $(curl -sS "$URL/api/students" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Daily records: $(curl -sS "$URL/api/daily-records" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"

      - name: Write report
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          {
            echo "# Worker API Deploy Report"
            echo "Date: $(date -u)"
            echo ""
            echo "- **Worker URL**: $URL"
            echo "- **Health**: $(curl -sS "$URL/api/health" 2>&1 || echo 'failed')"
            echo "- **Users**: $(curl -sS "$URL/api/users" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Halaqas**: $(curl -sS "$URL/api/halaqas" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Students**: $(curl -sS "$URL/api/students" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Daily records**: $(curl -sS "$URL/api/daily-records" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo ""
            echo "## Deploy output"
            echo '```'
            cat /tmp/deploy_output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > worker-deploy-report.md 2>&1
          cat worker-deploy-report.md

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker-deploy-report.md
          git commit -m "chore: add worker deploy report" || echo "no changes"
          git push || echo "nothing to push"
