name: Deploy Worker API

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Verify token
        run: npx wrangler whoami

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy_output.txt
          # Parse the workers.dev URL from output
          WORKER_URL=$(grep -oE 'https://[a-z0-9_-]+\.[a-z0-9_-]+\.workers\.dev' /tmp/deploy_output.txt | head -1)
          echo "WORKER_URL=$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

      - name: Health check + seed
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          echo "Worker URL: $URL"
          if [ -z "$URL" ]; then
            echo "ERROR: No worker URL found in deploy output"
            cat /tmp/deploy_output.txt
            exit 1
          fi
          sleep 2
          echo "=== Health ==="
          curl -sS "$URL/api/health"
          echo ""
          echo "=== Tables (empty) ==="
          curl -sS "$URL/api/halaqas" | head -c 200
          echo ""
          echo "=== Seeding data ==="
          curl -sS -X POST "$URL/api/seed" -H "Content-Type: application/json" -d '{}'
          echo ""
          echo "=== After seed ==="
          echo "Users: $(curl -sS "$URL/api/users" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Halaqas: $(curl -sS "$URL/api/halaqas" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Students: $(curl -sS "$URL/api/students" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
          echo "Daily records: $(curl -sS "$URL/api/daily-records" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"

      - name: Write report
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          {
            echo "# Worker API Deploy Report"
            echo "Date: $(date -u)"
            echo ""
            echo "- **Worker URL**: $URL"
            echo "- **Health**: $(curl -sS "$URL/api/health" 2>&1)"
            echo "- **Users**: $(curl -sS "$URL/api/users" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Halaqas**: $(curl -sS "$URL/api/halaqas" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Students**: $(curl -sS "$URL/api/students" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo "- **Daily records**: $(curl -sS "$URL/api/daily-records" 2>&1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?')"
            echo ""
            echo "## Deploy output"
            echo '```'
            cat /tmp/deploy_output.txt
            echo '```'
          } > worker-deploy-report.md 2>&1
          cat worker-deploy-report.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker-deploy-report.md
          git commit -m "chore: add worker deploy report" || echo "no changes"
          git push || echo "nothing to push"
